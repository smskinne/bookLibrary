<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookile</title>
    <meta name="description" content="A simple book library web app." />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <nav>
            <div class="bookshelf-graphic">
                <span class="book-graphics book-graphics-left" aria-hidden="true"></span>
                <h1>Bookpile</h1>
                <span class="book-graphics book-graphics-right" aria-hidden="true"></span>
            </div>
            <ul>
                <li><a href="#main-content">My Pile</a></li>
                <li><a href="#wishlist">Wishlist</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>
        <!-- Search Section -->
         <section class="search">
            <div class="search-bars">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search for books by title">
                    <button id="searchButton">Search</button>
                    <button id="clearButton">Clear</button>
                </div>
            </div>
            <div id="searchResults" class="search-results" hidden></div>
         </section>

    <main id="main-content">
        <!-- Main Book Pile -->
         <section class="book-pile">
            <h2>My Pile <span id="bookPileCount">(0 books)</span></h2>

             <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All Books</button>
                    <button class="filter-btn" data-filter="want-to-read">Want to Read</button>
                    <button class="filter-btn" data-filter="reading">Currently Reading</button>
                    <button class="filter-btn" data-filter="finished">Finished</button>
                </div>
                <div id="bookshelfContainer" class="books-grid"></div>
         </section>

        <!--Wishlist-->
        <section class="wishlist">
            <h2>Wishlist <span id="wishlistCount">(0 books)</span></h2>
            <div id="wishlistContainer" class="books-grid"></div>
        </section>
        
        <!-- Expanded Book Section -->
        <section id="book-info" class="book-info" hidden>
            <div class="book-info-content">
                <button id="closeBookInfo" class="close-btn">&times;</button>
                <div id="book-details"></div>
            </div>
        </section>
    </main>

    <footer>
        <small>&copy; <span id="year"></span> Bookpile</small>
    </footer>
    <script src="app.js" defer></script>
</body>
</html>
